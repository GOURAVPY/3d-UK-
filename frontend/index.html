<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live City 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0b10" />
    <!-- The loading screen lives here, not in React, so it shows on the first paint while the
         2 MB app script is still downloading. src/boot.ts moves it along and removes it. -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 16px;
        background: radial-gradient(120% 90% at 50% 40%, #171a26 0%, #0a0b10 70%);
        color: #f3f4f8; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #boot.gone { opacity: 0; visibility: hidden; }
      #boot .boot-card { width: min(360px, 100%); text-align: center; }
      #boot svg { width: 132px; max-width: 45%; height: auto; overflow: visible; }
      /* The logo draws itself: three lines leave the interchange, turn along the cube's edges, then trains run on them. */
      #boot .boot-edge { fill: none; stroke: #2a2f3f; stroke-width: 3.3; stroke-linecap: round; opacity: 0; animation: boot-fade 0.6s 1s forwards; }
      #boot .boot-track { fill: none; stroke-width: 6.64; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100;
        animation: boot-draw 1.1s cubic-bezier(0.5, 0, 0.2, 1) forwards; }
      #boot .boot-track:nth-of-type(2) { animation-delay: 0.15s; }
      #boot .boot-track:nth-of-type(3) { animation-delay: 0.3s; }
      #boot .boot-stop { fill: #0a0b10; stroke: #fff; stroke-width: 3.4; transform-origin: 32px 33.34px; transform: scale(0);
        animation: boot-pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
      #boot .boot-train { opacity: 0; animation: boot-fade 0.4s 1.3s forwards; fill: #fff; filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.9)); }
      #boot h1 { margin: 18px 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
      #boot .boot-sub { margin: 0 0 22px; color: #a3a9b9; }
      #boot .boot-bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      #boot .boot-bar i { display: block; height: 100%; width: 8%; border-radius: inherit;
        background: linear-gradient(90deg, #e32017, #0098d4, #6950a1); transition: width 0.5s ease; }
      #boot ol { list-style: none; margin: 16px 0 0; padding: 0; text-align: left; display: grid; gap: 8px; }
      #boot li { display: flex; align-items: center; gap: 10px; color: #6b7183; transition: color 0.3s; }
      #boot li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%;
        border: 2px solid currentColor; box-sizing: border-box; }
      #boot li.active { color: #f3f4f8; }
      #boot li.active::before { border-color: #0098d4; background: #0098d4; animation: boot-pulse 1s ease-in-out infinite; }
      #boot li.done { color: #a3a9b9; }
      #boot li.done::before { border-color: #00a86b; background: #00a86b; }
      #boot .boot-hint { min-height: 20px; margin: 14px 0 0; font-size: 12px; color: #a3a9b9; opacity: 0; transition: opacity 0.4s; }
      #boot .boot-hint.show { opacity: 1; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-fade { to { opacity: 1; } }
      @keyframes boot-pop { to { transform: scale(1); } }
      @keyframes boot-pulse { 50% { transform: scale(0.6); opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-track { animation: none; stroke-dashoffset: 0; }
        #boot .boot-stop { animation: none; transform: none; }
        #boot .boot-edge { animation: none; opacity: 1; }
        #boot .boot-train { display: none; }
        #boot li.active::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path class="boot-edge" d="M32 10.5L11.84 20.58M52.16 20.58v22.84M11.84 43.42L32 53.5" />
          <path id="boot-a" class="boot-track" pathLength="100" stroke="#e32017" d="M32 33.34V10.5l20.16 10.08" />
          <path id="boot-b" class="boot-track" pathLength="100" stroke="#0098d4" d="M32 33.34l20.16 10.08L32 53.5" />
          <path id="boot-c" class="boot-track" pathLength="100" stroke="#6950a1" d="M32 33.34L11.84 43.42V20.58" />
          <circle class="boot-train" r="1.7"><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"><mpath href="#boot-a" /></animateMotion></circle>
          <circle class="boot-train" r="1.7"><animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"><mpath href="#boot-b" /></animateMotion></circle>
          <circle class="boot-train" r="1.7"><animateMotion dur="3.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"><mpath href="#boot-c" /></animateMotion></circle>
          <circle class="boot-stop" cx="32" cy="33.34" r="4.75" />
        </svg>
        <h1>Live City 3D</h1>
        <p class="boot-sub">Every train in London, live</p>
        <div class="boot-bar"><i id="boot-bar"></i></div>
        <ol id="boot-steps">
          <li data-step="app" class="active">Loading the app</li>
          <li data-step="map">Drawing the map of London</li>
          <li data-step="track">Laying the real track</li>
          <li data-step="trains">Finding every train</li>
        </ol>
        <p class="boot-hint" id="boot-hint"></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
